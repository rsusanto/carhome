name: Build APK

# Every push to main builds a signed APK and publishes it as a GitHub Release.
# The version comes from git (see build.sh), so nothing needs bumping by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:   # rebuild only; publishes nothing

permissions:
  contents: write   # needed to publish Releases

# One build at a time, oldest first, so an older build can never become "latest".
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  KEEP_RELEASES: 10

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: versionCode is counted from commits

      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aapt apksigner android-sdk-platform-23 dalvik-exchange zipalign

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Never let CI sign with a freshly generated key: that APK could not
          # update the app already installed on the head unit.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set (see README.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > carhome.keystore

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./build.sh
          cat build/version.env >> "$GITHUB_ENV"

      - name: Remove signing key
        if: always()
        run: rm -f carhome.keystore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarHome-${{ env.VERSION_NAME }}
          path: CarHome.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION_NAME" >/dev/null 2>&1; then
            gh release upload "v$VERSION_NAME" CarHome.apk --clobber   # re-run of the same commit
          else
            gh release create "v$VERSION_NAME" CarHome.apk \
              --target "$GITHUB_SHA" --latest \
              --title "CarHome $VERSION_NAME" --generate-notes
          fi

      - name: Delete old releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" |
          while read -r tag; do
            echo "Deleting $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
